name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['client/**', 'shared/**', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check API URL is configured
        if: ${{ vars.VITE_API_URL == '' }}
        run: |
          echo "::error::Set the VITE_API_URL repository variable (Settings → Secrets and variables → Actions → Variables) to your Railway server URL."
          exit 1

      - run: npm ci

      - run: npm test

      - name: Build client
        run: npm run build --workspace client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
